name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew style oval-vote/tap
      - run: |
          if ls "$(brew --repository oval-vote/tap)"/Formula/*.rb >/dev/null 2>&1; then
            brew audit --strict --tap oval-vote/tap
            brew install oval-vote/tap/oval
            brew test oval-vote/tap/oval
          fi
